<div class="compose-modal-overlay" (click)="closeModal()">
  <div class="compose-modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>✍️ New Communication</h2>
      <button class="btn-close" (click)="closeModal()">✕</button>
    </div>

    <div *ngIf="isLoading" class="loading">Loading...</div>

    <div *ngIf="!isLoading" class="modal-content">
      <!-- Mode Selector -->
      <div class="mode-selector">
        <label>Communication Mode:</label>
        <div class="mode-buttons">
          <button
            *ngFor="let mode of communicationModes"
            class="mode-btn"
            [ngClass]="{ active: selectedMode === mode }"
            (click)="selectMode(mode)"
          >
            {{ modeIcons[mode] }} {{ mode }}
          </button>
        </div>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="error-message">
        ⚠️ {{ errorMessage }}
      </div>

      <!-- Email Form -->
      <div *ngIf="isEmailMode" class="form-section">
        <div class="form-group">
          <label>To:</label>
          <input
            type="email"
            [(ngModel)]="toField"
            placeholder="Recipient email"
            class="form-input"
          />
        </div>

        <div class="form-group">
          <label>CC:</label>
          <input
            type="email"
            [(ngModel)]="ccEmail"
            placeholder="Optional CC recipients"
            class="form-input"
          />
        </div>

        <div class="form-group">
          <label>Subject:</label>
          <input
            type="text"
            [(ngModel)]="subject"
            placeholder="Email subject"
            class="form-input"
          />
        </div>

        <div class="form-group">
          <label>Message:</label>
          <textarea
            [(ngModel)]="body"
            placeholder="Type your message..."
            class="form-textarea"
          ></textarea>
        </div>

        <div class="form-group">
          <label>Signature:</label>
          <textarea
            [(ngModel)]="signature"
            placeholder="Email signature"
            class="form-textarea signature"
          ></textarea>
        </div>

      </div>

      <!-- SMS/WhatsApp Form -->
      <div *ngIf="isSmsMode" class="form-section">
        <div class="form-group">
          <label>To:</label>
          <input
            type="tel"
            [(ngModel)]="toField"
            placeholder="e.g. +91XXXXXXXXXX"
            class="form-input"
          />
        </div>

        <div class="form-group">
          <label>Message:</label>
          <div class="sms-preview">
            {{ signature }}
          </div>
          <textarea
            [(ngModel)]="body"
            placeholder="Type your message..."
            class="form-textarea sms-textarea"
          ></textarea>
          <div class="character-count">
            {{ body.length }} / 160 characters
          </div>
        </div>
      </div>
    </div>

    <!-- Common Attachments Section (For All Channels) -->
    <div *ngIf="!isLoading" class="modal-content attachments-section">
      <div class="form-group">
        <div class="attachment-header">
          <label>📎 Attachments ({{ selectedAttachments.length }}):</label>
          <button type="button" class="btn-attach" (click)="fileInput.click()" [disabled]="isSending">
            Add File
          </button>
          <input 
            #fileInput
            type="file"
            multiple 
            (change)="onFileSelected($event)" 
            style="display: none;"
          />
        </div>

        <div *ngIf="selectedAttachments.length > 0" class="attachments-list">
          <div *ngFor="let att of selectedAttachments; let i = index" class="attachment-item" [class.uploading]="att.isUploading">
            <div class="att-info">
              <span class="att-icon">{{ att.isUploading ? '⏳' : '📄' }}</span>
              <span class="att-name">{{ att.name }}</span>
            </div>
            <button
              type="button"
              class="btn-remove"
              (click)="removeSelectedAttachment(i)"
              [disabled]="isSending"
            >
              ✕
            </button>
          </div>
        </div>
        <p class="attachment-note">Supports PDFs, Images, Videos, and Docs (Max 25MB).</p>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="closeModal()" [disabled]="isSending">
        Cancel
      </button>
      <button
        class="btn btn-primary"
        (click)="sendCommunication()"
        [disabled]="isSending"
      >
        {{ isSending ? '⏳ Sending...' : '✓ Send' }}
      </button>
    </div>
  </div>
</div>
